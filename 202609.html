<script>(function () {

  const isLocal = host === 'localhost' || host === '127.0.0.1'
    || /^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\./.test(host)  // Tailscale CGNAT 100.64.0.0/10
    || host.endsWith('.ts.net');
  const isOnline = host.endsWith('.github.io');
  const edition = isLocal ? 'local' : (isOnline ? 'online' : 'other');
  const banner = document.getElementById('edition-banner');
  const onlineUrl = "https://casa2024takayama.github.io/strava-report/";
  const localUrl = "http://100.102.14.59:8766/index.html";
  const baseTitle = document.title.replace(/ \[(ローカル|オンライン)\]/g, '');
  if (!banner) return;
  if (edition === 'local') {
    banner.className = 'edition-banner edition-local';
    banner.innerHTML = '💻 <strong>ローカル版</strong>（この Mac · serve_report）'
      + ' — 右上のボタンで更新 · 自動更新なし'
      + ' · <a href="' + onlineUrl + '" target="_blank" rel="noopener">オンライン版を開く</a>';

      + ' — 毎日 23:00 JST 自動更新 · Strava同期ボタン'

    document.title = baseTitle + ' [ローカル推奨]';
  }
})();</script>

<script>(function () {
  const panel = document.getElementById('update-panel');
  const btnUpdate = document.getElementById('btn-update');
  const btnCoach = document.getElementById('btn-coach');
  const btnGarmin = document.getElementById('btn-garmin');
  const hint = document.getElementById('update-hint');
  const statusBox = document.getElementById('update-status');
  const statusText = document.getElementById('update-status-text');
  const logEl = document.getElementById('update-log');
  const host = location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1'
    || /^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\./.test(host)  // Tailscale CGNAT 100.64.0.0/10
    || host.endsWith('.ts.net');
  const isGithubPages = host.endsWith('.github.io');
  const githubPanel = document.getElementById('github-sync-panel');
  const token = "";
  const authHeaders = token ? { 'X-Report-Token': token } : {};
  let pollTimer = null;
  let activeKind = null;

  if (isGithubPages && githubPanel && panel) {
    panel.style.display = 'none';
    githubPanel.style.display = 'flex';
  }

  if (!panel || !btnUpdate || !btnCoach) return;
  if (!isLocal) { return; }

  if (location.protocol === 'file:') {
    hint.textContent = 'file:// では不可 → python3 serve_report.py --open';
  }

  function setButtonsDisabled(disabled) {
    btnUpdate.disabled = disabled;
    btnCoach.disabled = disabled;
    if (btnGarmin) btnGarmin.disabled = disabled;
  }
  function setStatus(msg, isError, isSuccess) {
    statusBox.classList.add('visible');
    statusBox.classList.toggle('error', !!isError);
    statusBox.classList.toggle('success', !!isSuccess);
    statusText.textContent = msg;
  }
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function stepLabel(data) {
    const labels = { starting:'準備中…', fetch:'Strava から取得中…', coach:'Claude が評価中…',
      garmin:'Garmin から取得中…（数分かかります）', html:'HTML 再生成中…', done:'完了', error:'エラー' };
    return labels[data.step] || data.step;
  }
  async function pollStatus() {
    try {
      const res = await fetch('/api/status', { headers: authHeaders });
      const data = await res.json();
      const kind = data.kind || activeKind;
      const isSuccess = data.done && !data.running && !data.error;
      if (!isSuccess) { setStatus(stepLabel(data), !!data.error, false); }
      logEl.textContent = (data.log || []).slice(-12).join('\n');
      if (data.error) { setButtonsDisabled(false); stopPoll(); return; }
      if (data.done && !data.running) {
        stopPoll();
        if (kind === 'coach') {
          const ts = data.last_coach || '';
          setStatus(ts ? ('✓ AI コーチング完了 — ' + ts) : '✓ AI コーチング完了', false, true);
          const lastCoachEl = document.getElementById('last-coach-msg');
          if (lastCoachEl && ts) { lastCoachEl.className = 'last-coach ok'; lastCoachEl.textContent = '✓ 最終 AI 評価: ' + ts; }
        } else if (kind === 'garmin') {
          setStatus('✓ Garmin 取得・レポート再生成 完了', false, true);
          const lg = document.getElementById('last-garmin-msg');
          if (lg) lg.className = 'last-garmin ok';
        } else {
          const ts = data.last_fetch || '';
          setStatus(ts ? ('✓ 更新完了 — データ ' + ts) : '✓ 更新完了', false, true);
          const lastFetchEl = document.getElementById('last-fetch-msg');
          if (lastFetchEl && ts) { lastFetchEl.className = 'last-fetch ok'; lastFetchEl.textContent = '✓ 最終データ取得: ' + ts; }
          const coachTs = data.last_coach || '';
          const lastCoachEl = document.getElementById('last-coach-msg');
          if (lastCoachEl && coachTs) { lastCoachEl.className = 'last-coach ok'; lastCoachEl.textContent = '✓ 最終 AI 評価: ' + coachTs; }
          const warnEl = document.getElementById('last-coach-warn');
          if (warnEl) warnEl.remove();
        }
        setTimeout(function(){ location.reload(); }, 2500);
      }
    } catch (e) {
      setStatus('サーバーに接続できません', true, false);
      setButtonsDisabled(false);
      stopPoll();
    }
  }
  function warnFileProtocol() {
    alert('file:// では実行できません。\n\nターミナルで:\n  cd ~/Projects/strava-report\n  python3 serve_report.py --open\n\nを実行し、http://127.0.0.1:8766/index.html を開いてください。');
  }
  async function startJob(endpoint, kind, startMsg) {
    if (location.protocol === 'file:') { warnFileProtocol(); return; }
    activeKind = kind;
    setButtonsDisabled(true);
    setStatus(startMsg, false, false);
    logEl.textContent = '';
    try {
      const res = await fetch(endpoint, { method: 'POST', headers: authHeaders });
      const data = await res.json();
      if (!data.started) {
        setStatus(data.message || 'すでに処理が実行中です', false, false);
        if (data.message) logEl.textContent = data.message;
        setButtonsDisabled(false);
        return;
      }
      stopPoll();
      pollTimer = setInterval(pollStatus, 1500);
      pollStatus();
    } catch (e) {
      setStatus('API に接続できません。serve_report.py が起動しているか確認してください。', true, false);
      setButtonsDisabled(false);
    }
  }
  btnUpdate.addEventListener('click', function(){ startJob('/api/update', 'fetch', 'データ更新を開始しています…'); });
  btnCoach.addEventListener('click', function(){ startJob('/api/coach', 'coach', 'AI 評価を開始しています…（Claude API）'); });
  if (btnGarmin) { btnGarmin.addEventListener('click', function(){ startJob('/api/garmin', 'garmin', 'Garmin から取得を開始しています…（数分かかります）'); }); }
})();</script>

"月次レビュー", "meta": "claude-sonnet-4-6（Claude API）", "body": "<h3>2026年9月 ランニングレビュー<\/h3>\n<hr>\n<h3>1. 月間総評<\/h3>\n<p><strong>現時点（9/22）の走行距離：115.2km（22日経過・進捗73%）<\/strong><\/p>\n<p>進捗73%時点のペース基準は <strong>146km<\/strong>（200km×73%）。現在の115.2kmはこの基準に対して <strong>約31km不足（79%ペース）<\/strong> であり、月末までに残り8日間で <strong>約85km<\/strong> 走れば目標200kmに到達する計算です。1日あたり約10.6kmが必要で、これは1日休養を挟みながら週40km程度のペースとほぼ同等。ただし第4週がすでに12.3kmにとどまっており、残り8日で85km上乗せは<strong>かなり積極的な走り込みが必要<\/strong>な状況です。現実的には<strong>170〜185km前後で着地する可能性が高い<\/strong>と見ており、10月に向けてベースを再構築するための準備期間と捉えることも一つの選択肢です。<\/p>\n<p><strong>質・バランス面：<\/strong><\/p>\n<ul>\n<li>最大の特筆点は9/13の<strong>獲得標高1,229mのトレイル系ロング走<\/strong>。これは非常にユニークな刺激であり、有酸素の強化に一定貢献しています。<\/li>\n<li>一方で、複数のランにおいてイージーペースから突然4分台前半に突入するパターンが散見され、<strong>意図的なゾーン管理より「気分でスパートする」走り方<\/strong>が目立ちます。<\/li>\n<li>週間のクオリティセッションが1〜2回以上になっている週（第2週）があり、回復の確保が課題です。<\/li>\n<li>ダニエルズ原則の80/20比率でいうと、イージーの割合が80%を下回る日が複数あり、全体的に<strong>強度が高め<\/strong>に偏っています。<\/li>\n<\/ul>\n<hr>\n<h3>2. 週別評価<\/h3>\n<h4>第1週（9/1〜9/7）：30.3km<\/h4>\n<table class=\"md-table\"><tbody>\n<tr><th>日付<\/th><th>距離<\/th><th>評価<\/th><\/tr>\n<tr><td>9/2（水）<\/td><td>10.1km<\/td><td>E〜Rミックス<\/td><\/tr>\n<tr><td>9/5（土）<\/td><td>20.2km<\/td><td>ロングE（マラソンペース混在）<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>評価：良好なロング走でスタート、ただし9/2のスパートが気になる<\/strong><\/p>\n<p>9/5の20.2km（平均5:20/km、HR141）は月最長のランニング。序盤をしっかり抑えて（Lap1：6:01/km）、中盤から徐々にMペース帯（5:10〜4:45/km）へ上げるネガティブスプリット基調は<strong>非常に良い<\/strong>ペース配分です。ロング走としての質は高く評価できます。<\/p>\n<p>9/2の10.1km（HR141、6:08/km）は全体平均こそ遅いものの、ラップデータを見るとLap6で突然4:19/km（HR167）、その後100〜170m単位の繰り返し走（3:24〜4:22/km）が現れており、<strong>レペティション系の短距離インターバル<\/strong>を実施していたと推測されます。質の混在した練習で、回復走の位置づけなら強度が過剰です。<\/p>\n<p><strong>週間距離30.3kmは月間200km目標に対してやや少なめ<\/strong>（理想40km）ですが、ロング走の質が高いため許容範囲です。<\/p>\n<hr>\n<h4>第2週（9/8〜9/14）：41.7km<\/h4>\n<table class=\"md-table\"><tbody>\n<tr><th>日付<\/th><th>距離<\/th><th>評価<\/th><\/tr>\n<tr><td>9/11（金）<\/td><td>13.1km<\/td><td>E〜T/Iミックス<\/td><\/tr>\n<tr><td>9/12（土）<\/td><td>15.3km<\/td><td>E主体（ラスト2kmにスパート）<\/td><\/tr>\n<tr><td>9/13（日）<\/td><td>12.2km<\/td><td>トレイル（高強度・標高1,229m）<\/td><\/tr>\n<tr><td>9/13（日）<\/td><td>1.1km<\/td><td>クールダウン的ショートラン<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>評価：距離目標はクリアも、3日連続かつハード2本が問題<\/strong><\/p>\n<p>距離41.7kmは月間配分として理想的ですが、<strong>金・土・日と3日連続走<\/strong>、かつ土と日に<strong>それぞれ高強度の刺激<\/strong>が入っています。ダニエルズ原則では「クオリティセッションは週2回上限・必ず回復日を挟む」ことが求められますが、この週は<strong>実質的に週3回以上のクオリティ<\/strong>が入っており、累積疲労が懸念されます。<\/p>\n<p>9/13のトレイル走については後述の個別コメントで詳しく扱います。<\/p>\n<hr>\n<h4>第3週（9/15〜9/21）：30.9km<\/h4>\n<table class=\"md-table\"><tbody>\n<tr><th>日付<\/th><th>距離<\/th><th>評価<\/th><\/tr>\n<tr><td>9/18（金）<\/td><td>10.3km<\/td><td>テンポ〜I系ミックス<\/td><\/tr>\n<tr><td>9/20（日）<\/td><td>10.0km<\/td><td>E〜テンポ系ミックス<\/td><\/tr>\n<tr><td>9/21（月）<\/td><td>10.6km<\/td><td>E主体（Lap6に5:00/kmのプッシュ）<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>評価：距離は不足、しかし質の高い練習も含まれる<\/strong><\/p>\n<p>距離30.9kmは目標40kmに対して約9km不足。ただし9/18の走りはラスト4kmで4:41〜4:49/km（HR161〜166）とIゾーン近傍まで上げており、<strong>一定の質的刺激は確保できています<\/strong>。<\/p>\n<p>9/20は序盤5:20〜5:50/km（E域）から後半Lap6に突然4:36（HR143）→4:23（HR158）と切れ込み、その後Lap8は4:50（HR155）とやや落ちる。<strong>意図的なMペース走というより、気分でペースを変えてしまっている<\/strong>パターンで、練習の意図が曖昧です。<\/p>\n<p>9/21（月）のランチランは平均5:28/km・HR138で全体としてはEゾーン。Lap6に5:00まで上がりますがHR139と心拍は低めで、コース状況（下り？）の影響かもしれません。<\/p>\n<hr>\n<h4>第4週（9/22までの集計）：12.3km<\/h4>\n<table class=\"md-table\"><tbody>\n<tr><th>日付<\/th><th>距離<\/th><th>評価<\/th><\/tr>\n<tr><td>9/22（火）<\/td><td>2.3km<\/td><td>ウォームアップ/クールダウン的ショートラン<\/td><\/tr>\n<tr><td>9/22（火）<\/td><td>10.0km<\/td><td>テンポ〜I系ミックス<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>評価：週途中（22日時点）。この後8日間でどう積むかが鍵<\/strong><\/p>\n<p>9/22時点で12.3km。残り9/23〜9/30（8日間）で85km走れば200km到達ですが、<strong>毎日10km以上走り続ける必要があり、疲労蓄積リスクが高い<\/strong>です。現実的には週4〜5日で1日8〜12kmを積み重ね、<strong>170〜185km着地<\/strong>を目指しつつ10月に向けて疲労を溜めすぎない選択肢も合理的です。<\/p>\n<hr>\n<h3>3. 個別アクティビティコメント<\/h3>\n<h4>✅ 9/05（土）20.2km 午後のランニング — <strong>月間ベストラン<\/strong><\/h4>\n<p>平均5:20/km、HR141は<strong>EからMの中間域<\/strong>で非常に安定しています。序盤6:01→5:40→5:39と丁寧に入り、中盤5:17〜5:22で安定、Lap10に4:40（HR158）、Lap12に4:53、Lap14に4:50とMペース帯を挿入し、終盤Lap18〜21をクールダウン5:47〜6:27で締める構成は<strong>教科書的なロング走の組み立て<\/strong>です。距離・強度・ペース配分すべての面で高評価。<\/p>\n<hr>\n<h4>⚠️ 9/13（日）Morning Run 12.2km 獲得標高1,229m — <strong>要注意の最高強度ラン<\/strong><\/h4>\n<p>このランは全データ中で最も特異です。ラップを確認すると：<\/p>\n<ul>\n<li>Lap0〜2：4:18〜4:36/km（HR167〜183）→ スタートから全力に近い強度<\/li>\n<li>Lap3以降：ペースが急激に落ち6:04→7:13→8:00→<strong>11:35→14:15→19:14→17:23→11:43<\/strong>（HR156〜187）<\/li>\n<\/ul>\n<p>平均HR173.7、最大HR192という数値は<strong>このデータ中の最高心拍<\/strong>であり、かなりの高強度（IゾーンないしRゾーン）で走り出し、その後過酷な上り区間で心拍を維持しながら急激に失速しています。1,229mという獲得標高は10km程度のランとしては<strong>非常に過酷な山岳コース<\/strong>（平均勾配10%超の可能性）と推測されます。<\/p>\n<p><strong>良い点：<\/strong> トレイル・山岳走は筋力強化と有酸素適応に有効で、ロード練習にはない刺激を与えます。<\/p>\n<p><strong>改善点：<\/strong> スタートのペースが速すぎます（4:18/km・HR167からのスタートは平地換算でもIゾーン。標高が上がれば実質RゾーンのEX）。前日9/12に15.3kmを走った翌日のこの強度は<strong>回復が全く確保されていません<\/strong>。9/12→9/13（ハード→超ハード）の連日は過負荷のリスクが高く、第3週の距離不足（30.9km）の遠因になっている可能性も否定できません。今後トレイルを取り入れる場合は、前後にイージー日を必ず設けてください。<\/p>\n<hr>\n<h4>📊 9/22（火）夜のランニング 10.0km — <strong>意図的なスピード練習の萌芽<\/strong><\/h4>\n<p>ラップを分析すると：<\/p>\n<ul>\n<li>Lap0〜5：5:40〜5:00/km（E〜Mゾーン、HR122〜147）でウォームアップ<\/li>\n<li>Lap6：<strong>4:18/km（HR167）<\/strong> — Tゾーン上端〜Iゾーン<\/li>\n<li>Lap7：<strong>4:04/km（HR178）<\/strong> — IゾーンないしRゾーン<\/li>\n<li>Lap8：4:32/km（HR175）、Lap9：4:59/km（HR162）でダウン<\/li>\n<\/ul>\n<p>Lap7の4:04/kmは本月中の<strong>最速ラップ<\/strong>です。ある程度意図的なインターバル的刺激と思われますが、<strong>1km単位で2本というのはセット数が少なすぎるか、あるいは力尽きてしまった<\/strong>可能性があります。ダニエルズのIワークアウトであれば3〜5分の繰り返しを3〜5本が標準です。次回は<strong>ウォームアップ後にIペース3〜4分×3〜4本（つなぎ2〜3分jog）<\/strong>の形で構造化することを勧めます。<\/p>\n<hr>\n<h4>📊 9/18（金）10.3km 午後のランニング<\/h4>\n<p>ラップ後半（Lap7〜10）で4:43〜4:46/km（HR161〜166）が続き、ラスト0.28kmが4:33/km。<strong>Tゾーン上端からI下端の強度が後半4km続く<\/strong>形です。テンポ走として見れば、ウォームアップ（Lap0〜2）→徐々に上げる（Lap3〜6）→テンポ域（Lap7〜10）という流れは悪くありません。ただしテンポ走は<strong>20〜40分一定ペースを維持する<\/strong>のが理想であり、この練習は徐々に上げ続けるビルドアップ走に近く、狙いの強度の持続時間が短めです。<\/p>\n<hr>\n<h4>📊 9/12（土）15.3km 朝のランニング<\/h4>\n<p>序盤（Lap0〜2）を6:59〜5:59と非常に丁寧に入り、中盤はE域5:14〜5:43/kmで安定。Lap8が4:50（HR156）、Lap9が4:29（HR165）とスパートを入れた後、Lap10〜15で5:29〜6:06/kmに戻してクールダウン。<strong>全体として質の高いロングE走<\/strong>ですが、Lap9のスパートはやや唐突で、翌日にトレイル強度走が控えていたことを考えると<strong>ラスト2kmのスパートは不要だった<\/strong>と言えます。<\/p>\n<hr>\n<h3>4. ペース・心拍分析<\/h3>\n<h4>VDOT推定<\/h4>\n<p>最も信頼できる単独ランから推定します。<\/p>\n<ul>\n<li>9/22の10km（5:01/km、HR148）：10kmを50:10ペースで平均心拍148。心拍ベースでIゾーン〜Tゾーン下端とすると<strong>VDOT推定46〜48程度<\/strong>。<\/li>\n<li>9/5の20.2km（5:20/km、HR141）：マラソンペース域相当で距離・心拍とも安定。VDOT48前後と整合。<\/li>\n<\/ul>\n<p><strong>暫定VDOT：約47<\/strong><\/p>\n<table class=\"md-table\"><tbody>\n<tr><th>ゾーン<\/th><th>ペース目安（/km）<\/th><th>このランナーの実測値<\/th><\/tr>\n<tr><td>E（イージー）<\/td><td>5:50〜6:30<\/td><td>9/12序盤・9/21平均が概ね合致<\/td><\/tr>\n<tr><td>M（マラソン）<\/td><td>5:10〜5:25<\/td><td>9/5中盤・9/20中盤が合致<\/td><\/tr>\n<tr><td>T（テンポ）<\/td><td>4:40〜4:55<\/td><td>9/18ラスト・9/22ラスト付近<\/td><\/tr>\n<tr><td>I（インターバル）<\/td><td>4:10〜4:28<\/td><td>9/22 Lap6〜7、9/13序盤<\/td><\/tr>\n<tr><td>R（レペティション）<\/td><td>〜3:55<\/td><td>9/2の短距離スプリント部分<\/td><\/tr>\n<\/tbody><\/table>\n<h4>ゾーン配分の評価<\/h4>\n<p>全11アクティビティの質的分布を概算すると：<\/p>\n<ul>\n<li><strong>純粋なEゾーン走<\/strong>：9/12の大半・9/21の大半 → 約25〜30km<\/li>\n<li><strong>EとMの混在<\/strong>：9/5・9/20・9/11 → 約33km<\/li>\n<li><strong>T〜I強度を含む<\/strong>：9/2・9/18・9/22(10km)・9/13 → 約32km<\/li>\n<li><strong>不明（短距離）<\/strong>：9/22(2.3km)・9/13(1.1km) → 約3km<\/li>\n<\/ul>\n<p><strong>強度の高いランが全体の約28%を占めており、80/20原則の上限（20%）を超えています。<\/strong> 特にトレイル走（9/13）の強度は極めて高く、月全体のストレス指数を押し上げています。<\/p>\n<h4>心拍の傾向<\/h4>\n<ul>\n<li>最大HR192（9/13トレイル）は年齢推定最大心拍（仮に35歳とすると185）を超えており、<strong>VO2maxゾーン、あるいはそれ以上の強度<\/strong>に達しています。<\/li>\n<li>多くのランで最大HRが168〜180台に達しており、<strong>中低強度のランでも後半にHRが大きく跳ね上がる<\/strong>傾向があります。Eランであれば最大HRを抑えるよう意識することが重要です。<\/li>\n<li>平均HR143は月全体でやや高め（E走が主体なら130〜135程度が理想）。<\/li>\n<\/ul>\n<hr>\n<h3>5. 2026年10月の練習提案<\/h3>\n<h4>月間方針<\/h4>\n<p>10月の目標は<strong>月間200km・週5均等（40km/週）<\/strong>。9月で強度の高い練習が多かった反省を踏まえ、<strong>ダニエルズの80/20原則を徹底<\/strong>します。週2回のクオリティセッション（TまたはI）に加え、週1回のロングE走（16〜18km）を軸に据えます。連日高強度にならないよう、必ずEまたは休養を挟みます。<\/p>\n<p><strong>週間テーマ設定（4週＋端数）：<\/strong><\/p>\n<p>10/1〜10/5（第1週・5日）、10/6〜10/12（第2週・7日）、10/13〜10/19（第3週・7日）、10/20〜10/26（第4週・7日）、10/27〜10/31（第5週・5日）<\/p>\n<p>実用上、月間5週に均等分配すると<strong>40km/週<\/strong>（第1・5週は日数が少ないため32〜35kmに調整し、第2〜4週で42〜43kmを稼ぐ形）で200km合計を確保します。<\/p>\n<hr>\n<h5>第1週（10/1〜10/5）：有酸素ベース再構築 目標35km<\/h5>\n<table class=\"md-table\"><tbody>\n<tr><th>曜<\/th><th>日付<\/th><th>種別<\/th><th>距離<\/th><th>内容<\/th><\/tr>\n<tr><td>水<\/td><td>10/1<\/td><td>E<\/td><td>10km<\/td><td>イージー 6:10〜6:30/km、HR130以下で会話できるペースを厳守<\/td><\/tr>\n<tr><td>木<\/td><td>10/2<\/td><td>休養<\/td><td>—<\/td><td>完全休養またはストレッチ<\/td><\/tr>\n<tr><td>金<\/td><td>10/3<\/td><td>T<\/td><td>10km<\/td><td>W-up 2km(6:20/km)→テンポ5km(4:45〜4:55/km)→C-down 3km(6:10/km)<\/td><\/tr>\n<tr><td>土<\/td><td>10/4<\/td><td>E<\/td><td>7km<\/td><td>軽いイージー 6:20〜6:30/km、脚の感覚確認<\/td><\/tr>\n<tr><td>日<\/td><td>10/5<\/td><td>ロングE<\/td><td>18km<\/td><td>終始E域 5:50〜6:20/km、HR140以下で距離積み<\/td><\/tr>\n<\/tbody><\/table>\n<hr>\n<h5>第2週（10/6〜10/12）：基礎量の安定確保 目標40km<\/h5>\n<table class=\"md-table\"><tbody>\n<tr><th>曜<\/th><th>日付<\/th><th>種別<\/th><th>距離<\/th><th>内容<\/th><\/tr>\n<tr><td>月<\/td><td>10/6<\/td><td>休養<\/td><td>—<\/td><td>完全休養（ロング走翌日）<\/td><\/tr>\n<tr><td>火<\/td><td>10/7<\/td><td>E<\/td><td>8km<\/td><td>イージー 6:10/km、HR130台を維持<\/td><\/tr>\n<tr><td>水<\/td><td>10/8<\/td><td>T<\/td><td>10km<\/td><td>W-up 2km→テンポ6km(4:45〜4:50/km)→C-down 2km ※一定ペースを保つ<\/td><\/tr>\n<tr><td>木<\/td><td>10/9<\/td><td>E<\/td><td>8km<\/td><td>イージー 6:10/km<\/td><\/tr>\n<tr><td>金<\/td><td>10/10<\/td><td>休養<\/td><td>—<\/td><td>完全休養<\/td><\/tr>\n<tr><td>土<\/td><td>10/11<\/td><td>I<\/td><td>11km<\/td><td>W-up 3km→Iペース4:15〜4:20/km×4分×4本(ﾚｽﾄjog3分)→C-down 3km<\/td><\/tr>\n<tr><td>日<\/td><td>10/12<\/td><td>E<\/td><td>13km<\/td><td>イージーロング 6:00〜6:20/km<\/td><\/tr>\n<\/tbody><\/table>\n<hr>\n<h5>第3週（10/13〜10/19）：質の向上・VO2max刺激 目標42km<\/h5>\n<table class=\"md-table\"><tbody>\n<tr><th>曜<\/th><th>日付<\/th><th>種別<\/th><th>距離<\/th><th>内容<\/th><\/tr>\n<tr><td>月<\/td><td>10/13<\/td><td>休養<\/td><t   function initMap(a){
    if (!a.mapCoords || mapInited[a.id]) return;
    if (typeof L === 'undefined') return;
    try {
      const m = L.map(a.mapId, { zoomControl:true, attributionControl:false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
      const poly = L.polyline(a.mapCoords, { color:a.mapColor||'#FC4C02', weight:3, opacity:0.85 }).addTo(m);
      m.fitBounds(poly.getBounds(), { padding:[12,12] });
      L.circleMarker(a.mapCoords[0], { radius:6,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2 }).addTo(m);
      L.circleMarker(a.mapCoords[a.mapCoords.length-1], { radius:6,color:'#fff',fillColor:'#ef4444',fillOpacity:1,weight:2 }).addTo(m);
      mapInited[a.id] = true;
      setTimeout(function(){ m.invalidateSize(); }, 60);
    } catch(e){}
  }

  function setTab(tab){
    if (TABS.indexOf(tab) < 0) tab = 'today';
    state.tab = tab;
    try { localStorage.setItem('rr2-tab', tab); } catch(e){}
    if (location.hash !== '#'+tab){ try { history.replaceState(null,'','#'+tab); } catch(e){ location.hash = tab; } }
    document.querySelectorAll('.rr-tab').forEach(function(b){
      const active = b.getAttribute('data-tab') === tab;
      b.style.color = active ? '#1C1917' : '#78716C';
      b.style.borderBottom = active ? '3px solid #FC4C02' : '3px solid transparent';
    });
    TABS.forEach(function(k){ document.getElementById('tab-'+k).style.display = (k===tab) ? 'flex' : 'none'; });
  }

  renderToday(); renderPlan(); renderCoach(); renderRecords();
  document.querySelectorAll('.rr-tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
  window.addEventListener('hashchange', function(){ const t = (location.hash||'').replace('#',''); if (TABS.indexOf(t)>=0 && t!==state.tab) setTab(t); });
  let start = (location.hash||'').replace('#','');
  if (TABS.indexOf(start) < 0){ try { start = localStorage.getItem('rr2-tab') || 'today'; } catch(e){ start = 'today'; } }
  setTab(start);

  // スクロールでヘッダーを折りたたむ（モバイルで面積を圧縮。ヒステリシスでちらつき防止）
  (function(){
    const header = document.querySelector('.rr-header');
    if (!header) return;
    let collapsed = false, ticking = false;
    function apply(){
      ticking = false;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const want = collapsed ? (y > 60) : (y > 110);
      if (want !== collapsed){ collapsed = want; header.classList.toggle('rr-collapsed', collapsed); }
    }
    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; window.requestAnimationFrame(apply); }
    }, { passive: true });
    apply();
  })();
})();

</script>
</body>
