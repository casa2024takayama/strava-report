<script>(function () {
  const host = location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1'
    || /^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\./.test(host)  // Tailscale CGNAT 100.64.0.0/10
    || host.endsWith('.ts.net');
  const isOnline = host.endsWith('.github.io');
  const edition = isLocal ? 'local' : (isOnline ? 'online' : 'other');
  const banner = document.getElementById('edition-banner');
  const onlineUrl = "https://casa2024takayama.github.io/strava-report/";
  const localUrl = "http://100.102.14.59:8766/index.html";
  const baseTitle = document.title.replace(/ \[(ローカル|オンライン)\]/g, '');
  if (!banner) return;
  if (edition === 'local') {
    banner.className = 'edition-banner edition-local';
    banner.innerHTML = '💻 <strong>ローカル版</strong>（この Mac · serve_report）'
      + ' — 右上のボタンで更新 · 自動更新なし'
      + ' · <a href="' + onlineUrl + '" target="_blank" rel="noopener">オンライン版を開く</a>';
    document.title = baseTitle + ' [ローカル]';
  } else if (edition === 'online') {
    banner.className = 'edition-banner edition-online';
    banner.innerHTML = '🌐 <strong>オンライン版</strong>（GitHub Pages）'
      + ' — 毎日 23:00 JST 自動更新 · Strava同期ボタン'
      + ' · <a href="' + localUrl + '">ローカル版</a>';
    document.title = baseTitle + ' [オンライン]';
  } else {
    banner.className = 'edition-banner edition-other';
    banner.innerHTML = '⚠️ file:// では更新できません — ターミナルで <code>python3 serve_report.py --open</code> を実行し '
      + '<a href="' + localUrl + '">' + localUrl + '</a> をブックマークしてください';
    document.title = baseTitle + ' [ローカル推奨]';
  }
})();</script>

<script>(function () {
  const panel = document.getElementById('update-panel');
  const btnUpdate = document.getElementById('btn-update');
  const btnCoach = document.getElementById('btn-coach');
  const btnGarmin = document.getElementById('btn-garmin');
  const hint = document.getElementById('update-hint');
  const statusBox = document.getElementById('update-status');
  const statusText = document.getElementById('update-status-text');
  const logEl = document.getElementById('update-log');
  const host = location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1'
    || /^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\./.test(host)  // Tailscale CGNAT 100.64.0.0/10
    || host.endsWith('.ts.net');
  const isGithubPages = host.endsWith('.github.io');
  const githubPanel = document.getElementById('github-sync-panel');
  const token = "";
  const authHeaders = token ? { 'X-Report-Token': token } : {};
  let pollTimer = null;
  let activeKind = null;

  if (isGithubPages && githubPanel && panel) {
    panel.style.display = 'none';
    githubPanel.style.display = 'flex';
  }

  if (!panel || !btnUpdate || !btnCoach) return;
  if (!isLocal) { return; }

  if (location.protocol === 'file:') {
    hint.textContent = 'file:// では不可 → python3 serve_report.py --open';
  }

  function setButtonsDisabled(disabled) {
    btnUpdate.disabled = disabled;
    btnCoach.disabled = disabled;
    if (btnGarmin) btnGarmin.disabled = disabled;
  }
  function setStatus(msg, isError, isSuccess) {
    statusBox.classList.add('visible');
    statusBox.classList.toggle('error', !!isError);
    statusBox.classList.toggle('success', !!isSuccess);
    statusText.textContent = msg;
  }
  function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  function stepLabel(data) {
    const labels = { starting:'準備中…', fetch:'Strava から取得中…', coach:'Claude が評価中…',
      garmin:'Garmin から取得中…（数分かかります）', html:'HTML 再生成中…', done:'完了', error:'エラー' };
    return labels[data.step] || data.step;
  }
  async function pollStatus() {
    try {
      const res = await fetch('/api/status', { headers: authHeaders });
      const data = await res.json();
      const kind = data.kind || activeKind;
      const isSuccess = data.done && !data.running && !data.error;
      if (!isSuccess) { setStatus(stepLabel(data), !!data.error, false); }
      logEl.textContent = (data.log || []).slice(-12).join('\n');
      if (data.error) { setButtonsDisabled(false); stopPoll(); return; }
      if (data.done && !data.running) {
        stopPoll();
        if (kind === 'coach') {
          const ts = data.last_coach || '';
          setStatus(ts ? ('✓ AI コーチング完了 — ' + ts) : '✓ AI コーチング完了', false, true);
          const lastCoachEl = document.getElementById('last-coach-msg');
          if (lastCoachEl && ts) { lastCoachEl.className = 'last-coach ok'; lastCoachEl.textContent = '✓ 最終 AI 評価: ' + ts; }
        } else if (kind === 'garmin') {
          setStatus('✓ Garmin 取得・レポート再生成 完了', false, true);
          const lg = document.getElementById('last-garmin-msg');
          if (lg) lg.className = 'last-garmin ok';
        } else {
          const ts = data.last_fetch || '';
          setStatus(ts ? ('✓ 更新完了 — データ ' + ts) : '✓ 更新完了', false, true);
          const lastFetchEl = document.getElementById('last-fetch-msg');
          if (lastFetchEl && ts) { lastFetchEl.className = 'last-fetch ok'; lastFetchEl.textContent = '✓ 最終データ取得: ' + ts; }
          const coachTs = data.last_coach || '';
          const lastCoachEl = document.getElementById('last-coach-msg');
          if (lastCoachEl && coachTs) { lastCoachEl.className = 'last-coach ok'; lastCoachEl.textContent = '✓ 最終 AI 評価: ' + coachTs; }
          const warnEl = document.getElementById('last-coach-warn');
          if (warnEl) warnEl.remove();
        }
        setTimeout(function(){ location.reload(); }, 2500);
      }
    } catch (e) {
      setStatus('サーバーに接続できません', true, false);
      setButtonsDisabled(false);
      stopPoll();
    }
  }
  function warnFileProtocol() {
    alert('file:// では実行できません。\n\nターミナルで:\n  cd ~/Projects/strava-report\n  python3 serve_report.py --open\n\nを実行し、http://127.0.0.1:8766/index.html を開いてください。');
  }
  async function startJob(endpoint, kind, startMsg) {
    if (location.protocol === 'file:') { warnFileProtocol(); return; }
    activeKind = kind;
    setButtonsDisabled(true);
    setStatus(startMsg, false, false);
    logEl.textContent = '';
    try {
      const res = await fetch(endpoint, { method: 'POST', headers: authHeaders });
      const data = await res.json();
      if (!data.started) {
        setStatus(data.message || 'すでに処理が実行中です', false, false);
        if (data.message) logEl.textContent = data.message;
        setButtonsDisabled(false);
        return;
      }
      stopPoll();
      pollTimer = setInterval(pollStatus, 1500);
      pollStatus();
    } catch (e) {
      setStatus('API に接続できません。serve_report.py が起動しているか確認してください。', true, false);
      setButtonsDisabled(false);
    }
  }
  btnUpdate.addEventListener('click', function(){ startJob('/api/update', 'fetch', 'データ更新を開始しています…'); });
  btnCoach.addEventListener('click', function(){ startJob('/api/coach', 'coach', 'AI 評価を開始しています…（Claude API）'); });
  if (btnGarmin) { btnGarmin.addEventListener('click', function(){ startJob('/api/garmin', 'garmin', 'Garmin から取得を開始しています…（数分かかります）'); }); }
})();</script>

xt": "平均心拍数: 150 bpm"}, {"sym": "•", "color": "#D6D3CE", "text": "第1週: 28.5 km"}]}, "sections": [{"id": "review", "title": "月次レビュー", "meta": "claude-sonnet-4-6（Claude API）", "body": "<h3>2026年7月 ランニングレビュー<\/h3>\n<hr>\n<h3>1. 月間総評<\/h3>\n<p><strong>現時点（7/11）での進捗評価<\/strong><\/p>\n<p>7月11日時点（31日中11日経過・進捗約35%）で累計61.7km。月間200km目標の35%ペース基準である<strong>約70km<\/strong>に対し、約8km弱の遅れです。ただしこれは「不足確定」ではありません。現在のペース（11日で61.7km ≒ 5.6km/日）を残り20日に当てはめると、<strong>61.7 + 5.6×20 ≈ 173km<\/strong>が月末着地の見込みです（目標比 −27km程度）。後半に週45〜50km程度に引き上げれば200km達成は射程内ですが、以下の生理指標が深刻な懸念を示しています。<\/p>\n<p><strong>⚠️ 最大の問題は「身体の回復不足」<\/strong><\/p>\n<table class=\"md-table\"><tbody>\n<tr><th>指標<\/th><th>現状<\/th><th>コメント<\/th><\/tr>\n<tr><td>トレーニングステータス<\/td><td>UNPRODUCTIVE（月内 STRAINED×7）<\/td><td>刺激が強すぎて適応できていない<\/td><\/tr>\n<tr><td>トレーニングレディネス<\/td><td>平均20/100（範囲 1〜44）<\/td><td>高強度セッションに耐えられる状態ではない<\/td><\/tr>\n<tr><td>HRVステータス<\/td><td>UNBALANCED 6日 / BALANCED 2日<\/td><td>自律神経が慢性的に疲弊<\/td><\/tr>\n<tr><td>睡眠<\/td><td>スコア56・平均5.3時間<\/td><td>回復に必要な睡眠が明らかに不足<\/td><\/tr>\n<tr><td>安静時心拍<\/td><td>50 → 43 bpm<\/td><td>低下傾向は疲労蓄積・オーバーリーチの典型サイン<\/td><\/tr>\n<\/tbody><\/table>\n<p>走力指標（VO2max 57.2）は維持されていますが、これは「消耗しながら現状維持」という危険な状態です。量を増やす前に、まず身体を立て直すことが最優先事項です。<\/p>\n<hr>\n<h3>2. 週別評価<\/h3>\n<h4>第1週（7/1〜7/6）：28.5km<\/h4>\n<p><strong>良かった点<\/strong><\/p>\n<ul>\n<li>7/2 Night Run（10.3km）は序盤4km を6:00前後のイージーペースで入り、身体を温める意識が見られる。<\/li>\n<li>7/5 Evening Run（14km）は長めの距離をこなし、ロング走の代わりとして機能。<\/li>\n<\/ul>\n<p><strong>課題<\/strong><\/p>\n<ul>\n<li>7/5に同日2回走（Evening 14km + Night 4.2km）を実施。Evening Runで最大HR198bpmという極めて高い強度に達した後、同日夜にも追加走行しており、<strong>回復を完全に無視した練習配置<\/strong>。<\/li>\n<li>7/2 Night RunのLap6（4:49/km・HR163）は、イージー走のつもりならペースの突然の跳ね上がりが目立ち、ペース管理が乱れている。<\/li>\n<\/ul>\n<h4>第2週（7/7〜7/11）：33.2km<\/h4>\n<p><strong>良かった点<\/strong><\/p>\n<ul>\n<li>7/8 夜のランニング（12.3km）は全ラップが概ねイージーゾーン（HR 118〜143bpm）で安定しており、唯一のコントロールされた練習。<\/li>\n<\/ul>\n<p><strong>課題<\/strong><\/p>\n<ul>\n<li>7/11に3アクティビティを実施（Morning 7.4km + Lunch①3.2km + Lunch②10.3km）。<strong>1日に21km弱・3セッションの詰め込み<\/strong>であり、疲弊している身体への追い打ちとなっています。<\/li>\n<li>この日の練習配置がトレーニングレディネス1（最低値域）の主因と推察されます。<\/li>\n<\/ul>\n<hr>\n<h3>3. 個別アクティビティコメント<\/h3>\n<h4>🔴 2026-07-05 Evening Run（14km・4:44/km・HR159・最大198bpm）<\/h4>\n<p><strong>最も懸念されるセッション。<\/strong><\/p>\n<p>ラップ分析で後半の構造が明確に見えます：<\/p>\n<ul>\n<li>Lap1〜5：5:19〜5:53/km（HR127〜145）→ウォームアップ相当<\/li>\n<li>Lap6〜7：4:43〜4:18/km（HR157〜171）→Iゾーン域へ急加速<\/li>\n<li>Lap8〜10：4:04〜4:13/km（HR174〜180）→<strong>インターバル強度<\/strong><\/li>\n<li>Lap11〜12：4:24〜4:30/km（HR174）→不完全なリカバリー<\/li>\n<li>Lap13〜14：4:02〜4:05/km（HR185〜188）→<strong>最大努力近く<\/strong><\/li>\n<li>最大HR198bpm → HRmaxに非常に近い値<\/li>\n<\/ul>\n<p>14kmという距離でこの強度は、Eゾーン走を装ったインターバルです。最後の2kmでHR185〜188bpmに達するのは身体への過大なダメージを伴います。同日夜にNight Runを追加したことで、回復ゼロの状態が翌日以降も続いています。<\/p>\n<h4>🔴 2026-07-05 Night Run（4.2km・6:14/km・最大HR175bpm）<\/h4>\n<p>Evening Runの直後セッション。Lap3〜10に短い区間での急激な加速（3:06〜3:30/km）と徐行（7:34〜9:43/km）が混在しており、<strong>インターバル的な強度変動<\/strong>があります。疲弊した状態でのこの動きはリスクしかありません。即座に中止すべきセッションです。<\/p>\n<h4>🟡 2026-07-02 Night Run（10.3km・5:48/km・最大HR183bpm）<\/h4>\n<p>序盤5kmはHR121〜134bpmのイージー走として良好。しかしLap6（4:49/km・HR164）で突然加速し、その後Lap8〜17でショートインターバル的な動き（3:21〜3:50/kmと7:17〜8:14/kmを交互）が入っています。「イージー走のつもりで始めてその場でインターバルに変えた」パターンです。セッションの目的を事前に決めて守ることを推奨します。<\/p>\n<h4>🟡 2026-07-11 Lunch Run（10.3km・5:00/km・HR171・最大182bpm）<\/h4>\n<p>ラップ分析：<\/p>\n<ul>\n<li>Lap1〜2：4:25〜4:28/km（HR165〜175）→明らかにI〜Tゾーン<\/li>\n<li>Lap5〜10：4:33〜4:38/km（HR167〜175）<\/li>\n<li>Lap13〜18：4:24〜4:44/km（HR169〜177）<\/li>\n<\/ul>\n<p>休憩ラップ（Lap4・8・12・16・20に27秒〜32秒/kmの超低速区間）を挟んでいることから、<strong>短インターバルセッション<\/strong>として実施したと考えられます。HR171〜177bpm域での繰り返しはI強度相当。ただし、同日午前にMorning Runを行い、さらに先行してLunch Run①も消化した後のセッションであり、<strong>疲労蓄積状態での高強度練習はリスクが高い<\/strong>です。<\/p>\n<h4>✅ 2026-07-08 夜のランニング（12.3km・5:52/km・HR135・最大161bpm）<\/h4>\n<p>月間唯一のコントロールされたイージー走。全ラップがHR119〜143bpmで安定し、ダニエルズのEゾーン（HRmax 59〜74%目安）に近い領域をほぼ維持。唯一「正しい練習」と言えるセッションです。このような練習が週間の主体であるべきです。<\/p>\n<h4>🟡 2026-07-11 Morning Run（7.4km・5:14/km・HR146・最大171bpm）<\/h4>\n<p>Lap1〜5は5:16〜5:35/km・HR128〜150でEゾーン的に推移。しかしLap6〜7で4:42〜4:53/km・HR161〜164に跳ね上がり、EからT/M境界域へ。ウォームアップから始まるファルトレク的な流れは悪くありませんが、この日に3セッション詰め込む文脈では過負荷です。<\/p>\n<h4>🟡 2026-07-11 Lunch Run①（3.2km・6:00/km・HR150）<\/h4>\n<p>ウォームアップ的な短い走りで、内容は悪くありません。ただし同日の2回目・3回目セッションの前座になっており、<strong>単独なら問題なし・この日の文脈では過剰<\/strong>です。<\/p>\n<hr>\n<h3>4. ペース・心拍分析<\/h3>\n<h4>VDOT推定<\/h4>\n<p>Garmin計測VO2max 57.2を基準とすると、ダニエルズのVDOT換算での各ペースゾーン目安は以下の通りです：<\/p>\n<table class=\"md-table\"><tbody>\n<tr><th>ゾーン<\/th><th>ペース目安（/km）<\/th><th>HR目安（HRmax比）<\/th><\/tr>\n<tr><td>E（イージー）<\/td><td>5:10〜5:50<\/td><td>59〜74%<\/td><\/tr>\n<tr><td>M（マラソン）<\/td><td>4:30〜4:45<\/td><td>75〜84%<\/td><\/tr>\n<tr><td>T（テンポ）<\/td><td>4:10〜4:20<\/td><td>83〜88%<\/td><\/tr>\n<tr><td>I（インターバル）<\/td><td>3:50〜4:00<\/td><td>97〜100%<\/td><\/tr>\n<tr><td>R（レペティション）<\/td><td>3:30〜3:45<\/td><td>最大<\/td><\/tr>\n<\/tbody><\/table>\n<p>最大HR推定：7/5 Evening RunでHR198bpmを記録しており、<strong>HRmax ≒ 198〜200bpm<\/strong>と推定します。<\/p>\n<h4>ゾーン配分の評価<\/h4>\n<table class=\"md-table\"><tbody>\n<tr><th>セッション<\/th><th>実際のHR<\/th><th>推定ゾーン<\/th><\/tr>\n<tr><td>7/02 Night Run<\/td><td>終盤163〜183bpm<\/td><td>M〜Iゾーン混在<\/td><\/tr>\n<tr><td>7/05 Evening Run<\/td><td>後半174〜198bpm<\/td><td>I〜最大<\/td><\/tr>\n<tr><td>7/05 Night Run<\/td><td>一部163〜175bpm<\/td><td>M〜Iゾーン<\/td><\/tr>\n<tr><td>7/08 夜ラン<\/td><td>119〜143bpm<\/td><td><strong>Eゾーン ✅<\/strong><\/td><\/tr>\n<tr><td>7/11 Morning<\/td><td>128〜164bpm<\/td><td>E〜Mゾーン<\/td><\/tr>\n<tr><td>7/11 Lunch①<\/td><td>142〜157bpm<\/td><td>E〜Mゾーン<\/td><\/tr>\n<tr><td>7/11 Lunch②<\/td><td>165〜181bpm<\/td><td>I〜最大域<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>総評：7セッション中、ダニエルズの原則（80%イージー）に沿っているのは7/8のみ。<\/strong>残り6セッションで高強度が混入しており、クオリティセッションが週2回どころか事実上毎日発生しています。ダニエルズの「週2回上限」を大幅に超過しており、これがSTRAINED連続・UNPRODUCTIVE状態の直接原因です。<\/p>\n<hr>\n<h3>5. 2026年8月の練習提案<\/h3>\n<h4>基本方針<\/h4>\n<p>生理指標が深刻なオーバーリーチを示しているため、<strong>8月の最初の2週間は徹底的な回復とベース再構築<\/strong>を最優先にします。睡眠を7時間以上確保することが練習と同等に重要です。後半2週間でクオリティを1週1回に限定しながら量を戻します。8月はレースなしのため、200kmを5週均等（約40km/週）で分配しますが、第1週はあえて30kmに抑えて回復を確保し、第4〜5週で補填します。<\/p>\n<p><strong>月間方針サマリー<\/strong><\/p>\n<ul>\n<li>第1週（8/1〜8/3）：回復週・30km ← 週3日のみ（月頭の3日間）<\/li>\n<li>第2週（8/4〜8/10）：ベース構築・38km<\/li>\n<li>第3週（8/11〜8/17）：有酸素強化・42km<\/li>\n<li>第4週（8/18〜8/24）：クオリティ導入・45km<\/li>\n<li>第5週（8/25〜8/31）：仕上げ・45km<\/li>\n<li><strong>合計：200km<\/strong><\/li>\n<\/ul>\n<blockquote class=\"md-quote\">🔑 <strong>ペースの基準（VDOT57）<\/strong><\/blockquote>\n<blockquote class=\"md-quote\">- Eペース：5:15〜5:50/km（HR ≦ 148bpm目安）<\/blockquote>\n<blockquote class=\"md-quote\">- Mペース：4:35〜4:45/km<\/blockquote>\n<blockquote class=\"md-quote\">- Tペース：4:10〜4:20/km（20分以内の連続）<\/blockquote>\n<blockquote class=\"md-quote\">- Iペース：3:50〜4:00/km（400m〜1000mの繰り返し）<\/blockquote>\n<blockquote class=\"md-quote\">- <strong>心拍を優先し、ペースが遅くなっても構わない（夏場は+20〜30秒/kmも許容）<\/strong><\/blockquote>\n<hr>\n<h5>第1週（8/1〜8/3）：完全回復 目標30km<\/h5>\n<table class=\"md-table\"><tbody>\n<tr><th>曜<\/th><th>日付<\/th><th>種別<\/th><th>距離<\/th><th>内容<\/th><\/tr>\n<tr><td>土<\/td><td>8/1<\/td><td>E<\/td><td>10km<\/td><td>イージー 5:30〜6:00/km・HR≦145bpm・会話できるペースを厳守<\/td><\/tr>\n<tr><td>日<\/td><td>8/2<\/td><td>休養<\/td><td>—<\/td><td>完全休養または10分ストレッチのみ<\/td><\/tr>\n<tr><td>月<\/td><td>8/3<\/td><td>E<\/td><td>10km<\/td><td>イージー 5:30〜6:00/km・HR≦145bpm<\/td><\/tr>\n<tr><td>火<\/td><td>8/4<\/td><td>休養<\/td><td>—<\/td><td>※第2週に移行（下記参照）<\/td><\/tr>\n<\/tbody><\/table>\n<blockquote class=\"md-quote\">※ 8/1〜8/3の3日間で20kmを目安に無理なく走る。HRVが低い日は迷わず休養に変更すること。<\/blockquote>\n<hr>\n<h5>第2週（8/4〜8/10）：ベース再構築 目標38km<\/h5>\n<table class=\"md-table\"><tbody>\n<tr><th>曜<\/th><th>日付<\/th><th>種別<\/th><th>距離<\/th><th>内容<\/th><\/tr>\n<tr><td>火<\/td><td>8/4<\/td><td>E<\/td><td>8km<\/td><td>イージー 5:30〜5:50/km・HR≦145bpm<\/td><\/tr>\n<tr><td>水<\/td><td>8/5<\/td><td>休養<\/td><td>—<\/td><td>完全休養<\/td><\/tr>\n<tr><td>木<\/td><td>8/6<\/td><td>E<\/td><td>10km<\/td><td>イージー 5:30〜5:50/km・後半2kmのみ5:00/km（気分が良ければ）<\/td><\/tr>\n<tr><td>金<\/td><td>8/7<\/td><td>休養<\/td><td>—<\/td><td>完全休養<\/td><\/tr>\n<tr><td>土<\/td><td>8/8<\/td><td>ロングE<\/td><     h += "<div style='background:#fff;border:1px solid #E7E5E1;border-radius:14px;padding:18px'><div style='font-size:12px;font-weight:800;color:#78716C;letter-spacing:.08em;margin-bottom:18px'>VDOT 進捗 — Sub 3:00 への道</div><div style='position:relative;height:10px;background:linear-gradient(90deg,#E0DED9 0%,#93B4F5 60%,#F5C063 73%,#F08A8A 100%);border-radius:5px;margin:0 8px'><div style='position:absolute;left:0%;top:16px;font-size:10.5px;color:#78716C;transform:translateX(-4px)'>VDOT "+vd.pbVdot+"<br><span style='font-weight:700'>PB "+esc(vd.pbStr)+"</span></div><div style='position:absolute;left:"+vd.markerPct+"%;top:-30px;transform:translateX(-50%);text-align:center'><div style='font-size:10.5px;font-weight:900;color:#2563EB;white-space:nowrap'>現在 "+vd.current+"</div></div><div style='position:absolute;left:"+vd.markerPct+"%;top:-6px;transform:translateX(-50%);width:22px;height:22px;background:#fff;border:4px solid #2563EB;border-radius:50%'></div><div style='position:absolute;left:73%;top:16px;transform:translateX(-50%);font-size:10.5px;color:#B45309;text-align:center;white-space:nowrap'>VDOT 59<br><span style='font-weight:800'>Sub 3:10</span></div><div style='position:absolute;right:0;top:16px;font-size:10.5px;color:#B91C1C;text-align:right;white-space:nowrap'>VDOT 63<br><span style='font-weight:800'>Sub 3:00</span></div></div><div style='height:48px'></div><div style='background:#FAFAF8;border-radius:11px;padding:14px 16px;font-size:12.5px;color:#57534E;line-height:1.9'><strong style='color:#1C1917'>Sub 3:00 への 3 つの柱</strong><br>① 週間走行量 <strong>70〜80km</strong>（現在 ~50km）<br>② 月2回以上の <strong>30km ロング走</strong><br>③ 週1回の <strong>テンポ走 or インターバル</strong></div></div>";
    let tg = '';
    R.targets.forEach(function(t){ tg += "<div style='background:#fff;border:1px solid #E7E5E1;border-radius:14px;padding:18px;text-align:center'><div style='font-size:11px;font-weight:800;color:#78716C;letter-spacing:.1em;margin-bottom:6px'>"+esc(t.kicker)+"</div><div style='font-size:30px;font-weight:900;color:"+t.color+"'>"+esc(t.value)+"</div><div style='font-size:11.5px;color:#A8A29E;margin-top:4px'>"+esc(t.sub)+"</div></div>"; });
    h += "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px'>"+tg+"</div>";
    el.innerHTML = h;
  }

  function initMap(a){
    if (!a.mapCoords || mapInited[a.id]) return;
    if (typeof L === 'undefined') return;
    try {
      const m = L.map(a.mapId, { zoomControl:true, attributionControl:false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
      const poly = L.polyline(a.mapCoords, { color:a.mapColor||'#FC4C02', weight:3, opacity:0.85 }).addTo(m);
      m.fitBounds(poly.getBounds(), { padding:[12,12] });
      L.circleMarker(a.mapCoords[0], { radius:6,color:'#fff',fillColor:'#22c55e',fillOpacity:1,weight:2 }).addTo(m);
      L.circleMarker(a.mapCoords[a.mapCoords.length-1], { radius:6,color:'#fff',fillColor:'#ef4444',fillOpacity:1,weight:2 }).addTo(m);
      mapInited[a.id] = true;
      setTimeout(function(){ m.invalidateSize(); }, 60);
    } catch(e){}
  }

  function setTab(tab){
    if (TABS.indexOf(tab) < 0) tab = 'today';
    state.tab = tab;
    try { localStorage.setItem('rr2-tab', tab); } catch(e){}
    if (location.hash !== '#'+tab){ try { history.replaceState(null,'','#'+tab); } catch(e){ location.hash = tab; } }
    document.querySelectorAll('.rr-tab').forEach(function(b){
      const active = b.getAttribute('data-tab') === tab;
      b.style.color = active ? '#1C1917' : '#78716C';
      b.style.borderBottom = active ? '3px solid #FC4C02' : '3px solid transparent';
    });
    TABS.forEach(function(k){ document.getElementById('tab-'+k).style.display = (k===tab) ? 'flex' : 'none'; });
  }

  renderToday(); renderPlan(); renderCoach(); renderRecords();
  document.querySelectorAll('.rr-tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
  window.addEventListener('hashchange', function(){ const t = (location.hash||'').replace('#',''); if (TABS.indexOf(t)>=0 && t!==state.tab) setTab(t); });
  let start = (location.hash||'').replace('#','');
  if (TABS.indexOf(start) < 0){ try { start = localStorage.getItem('rr2-tab') || 'today'; } catch(e){ start = 'today'; } }
  setTab(start);

  // スクロールでヘッダーを折りたたむ（モバイルで面積を圧縮。ヒステリシスでちらつき防止）
  (function(){
    const header = document.querySelector('.rr-header');
    if (!header) return;
    let collapsed = false, ticking = false;
    function apply(){
      ticking = false;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const want = collapsed ? (y > 60) : (y > 110);
      if (want !== collapsed){ collapsed = want; header.classList.toggle('rr-collapsed', collapsed); }
    }
    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; window.requestAnimationFrame(apply); }
    }, { passive: true });
    apply();
  })();
})();

</script>
